name: Fetch Clash Meta APK

# 只为把 GitHub release 上的 Clash Meta 搬成 artifact（artifact CDN 在国内可直连）
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Clash Meta release tag'
        required: true
        default: 'v2.11.35'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Clash Meta APK
        run: |
          set -e
          TAG="${{ github.event.inputs.tag }}"
          URL="https://github.com/MetaCubeX/ClashMetaForAndroid/releases/download/${TAG}/cmfa-${TAG#v}-meta-arm64-v8a-release.apk"
          echo "下载 $URL"
          curl -fSL --retry 3 -o clash.apk "$URL"
          ls -la clash.apk
      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: clash-apk
          path: clash.apk
          if-no-files-found: error
